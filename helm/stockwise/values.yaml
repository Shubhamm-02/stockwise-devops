# Default values. Environment-specific files override these:
#   values-local.yaml  -> minikube with locally built images
#   values-gitops.yaml -> Argo CD, image tags updated by CI

imagePullSecrets: []

config:
  logLevel: INFO

backend:
  image:
    repository: ghcr.io/shubhamm-02/stockwise-devops/stockwise-backend
    tag: ""          # set to a Git commit SHA by CI; never "latest"
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: ghcr.io/shubhamm-02/stockwise-devops/stockwise-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image: postgres:16-alpine
  database: stockwise
  username: stockwise
  # Leave empty to generate a random password on first install (kept on upgrades).
  # For GitOps, create a Secret yourself and name it in existingSecret instead.
  password: ""
  existingSecret: ""
  existingSecretKey: postgres-password
  storage:
    size: 1Gi
    storageClass: ""   # empty = cluster default
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

migrations:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: stockwise.local
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 15s
  # kube-prometheus-stack only picks up ServiceMonitors with its release label
  labels:
    release: kube-prometheus-stack
