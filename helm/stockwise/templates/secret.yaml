{{- if not .Values.postgres.existingSecret }}
{{- $name := include "stockwise.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.password }}
{{- if not $password }}
{{- if $existing }}{{- $password = index $existing.data .Values.postgres.existingSecretKey | b64dec }}
{{- else }}{{- $password = randAlphaNum 24 }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stockwise.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.postgres.existingSecretKey }}: {{ $password | b64enc | quote }}
{{- end }}
