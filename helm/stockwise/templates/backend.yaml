apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockwise.backendName" . }}
  labels:
    {{- include "stockwise.labels" . | nindent 4 }}
    {{- include "stockwise.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stockwise.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockwise.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        # Restart pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "stockwise.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          # Migrations run in a separate Job, so only start the API here
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.backend.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "stockwise.fullname" . }}-config
          env:
            {{- include "stockwise.dbEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "stockwise.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockwise.backendName" . }}
  labels:
    {{- include "stockwise.labels" . | nindent 4 }}
    {{- include "stockwise.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockwise.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
