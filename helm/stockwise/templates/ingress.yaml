{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stockwise.fullname" . }}
  labels:
    {{- include "stockwise.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api goes straight to the backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockwise.backendName" . }}
                port:
                  name: http
          # everything else is the React app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockwise.frontendName" . }}
                port:
                  name: http
{{- end }}
