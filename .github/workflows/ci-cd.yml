name: StockWise CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/stockwise/values-gitops.yaml"   # written by this pipeline
      - "**/*.md"
      - "screenshots/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_DIR: application/backend
  FRONTEND_DIR: application/frontend

jobs:
  # ------------------------------------------------------------------ CI
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (a failure stops the pipeline)
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 3

  # ------------------------------------------------------------------ security checks
  sast:
    name: SAST (Bandit + CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bandit (fails on medium or high findings)
        run: |
          pip install bandit
          bandit -r ${{ env.BACKEND_DIR }}/app -ll
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
          source-root: application
      - uses: github/codeql-action/analyze@v4

  sca:
    name: SCA (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r ${{ env.BACKEND_DIR }}/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Node dependencies (fail on high or critical)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan project files for committed secrets
        run: |
          docker run --rm -v "$PWD:/scan" zricethezav/gitleaks:latest \
            detect --no-git --source /scan --redact --verbose

  # ------------------------------------------------------------------ images
  build-images:
    name: Build ${{ matrix.component }} image
    needs: [backend-test, frontend-build, sast, sca, secret-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build (tagged with the commit SHA, never "latest")
        run: docker build -t stockwise-${{ matrix.component }}:${{ github.sha }} application/${{ matrix.component }}
      - name: Save image so later jobs use the exact same image
        run: docker save stockwise-${{ matrix.component }}:${{ github.sha }} -o /tmp/${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp/${{ matrix.component }}.tar
          retention-days: 1

  image-scan:
    name: Trivy scan ${{ matrix.component }}
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/${{ matrix.component }}.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security-gate:
    name: Security gate
    needs: [backend-test, frontend-build, sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests, SAST, SCA, secret scan and image scans all passed. Images may be published."

  # ------------------------------------------------------------------ CD
  push-images:
    name: Push ${{ matrix.component }} to GHCR
    needs: security-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag with the commit SHA and push
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$REPO/stockwise-${{ matrix.component }}:${{ github.sha }}
          docker load -i /tmp/${{ matrix.component }}.tar
          docker tag stockwise-${{ matrix.component }}:${{ github.sha }} $IMAGE
          docker push $IMAGE
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: Deploy to Kubernetes (kind) and smoke test
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp
          merge-multiple: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: stockwise-ci
      - name: Load the pipeline's images into the cluster
        run: |
          for c in backend frontend; do
            docker load -i /tmp/$c.tar
            kind load docker-image stockwise-$c:${{ github.sha }} --name stockwise-ci
          done
      - name: Helm install
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          helm upgrade --install stockwise helm/stockwise -n stockwise \
            --set backend.image.repository=stockwise-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=stockwise-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set ingress.enabled=false \
            --wait --timeout 5m
          kubectl get pods,svc -n stockwise
      - name: Smoke test
        run: |
          kubectl port-forward -n stockwise svc/stockwise-frontend 3000:80 &
          sleep 5
          curl -sf http://localhost:3000/healthz
          curl -sf http://localhost:3000/api/stats
          curl -sf -X POST http://localhost:3000/api/products -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke test","sku":"CI-1","quantity":1,"price":1}'
          curl -sf http://localhost:3000/api/products | grep -q CI-1 && echo "Smoke test passed"

  # ------------------------------------------------------------------ GitOps
  gitops-update:
    name: GitOps - bump image tags
    needs: deploy-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Write the new SHA into values-gitops.yaml (Argo CD deploys it)
        run: |
          FILE=helm/stockwise/values-gitops.yaml
          sed -i -E "s/^(\s*tag:).*/\1 \"${{ github.sha }}\"/" "$FILE"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "gitops: deploy StockWise ${GITHUB_SHA::7} [skip ci]" || { echo "No change"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
