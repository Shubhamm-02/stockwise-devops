# Grafana settings for kube-prometheus-stack (passed as a second -f file)
grafana:
  defaultDashboardsTimezone: browser
  # The admin password is generated by the chart and stored in a Secret.
  # Read it with the command in monitoring/README.md. Nothing secret is kept in Git.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard   # any ConfigMap with this label becomes a dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
