<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#fff"/>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">StockWise: End-to-End DevOps Architecture</text>

  <!-- Developer & GitHub -->
  <rect x="30" y="80" width="150" height="70" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">Developer</text>
  <text x="105" y="130" text-anchor="middle" font-size="12" fill="#4338ca">git push</text>
  <rect x="220" y="80" width="170" height="70" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="305" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">GitHub repo</text>
  <text x="305" y="130" text-anchor="middle" font-size="12" fill="#374151">source of truth</text>
  <line x1="180" y1="115" x2="218" y2="115" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <!-- CI pipeline -->
  <rect x="30" y="180" width="1340" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="1352" y="205" text-anchor="end" font-size="15" font-weight="bold" fill="#334155">GitHub Actions pipeline</text>
  <g font-size="12" text-anchor="middle">
    <rect x="45" y="220" width="140" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="115" y="250" font-weight="bold" fill="#14532d">Build &amp; Test</text><text x="115" y="270" fill="#166534">pytest (16 tests)</text><text x="115" y="288" fill="#166534">React build</text>
    <rect x="215" y="220" width="170" height="90" rx="8" fill="#fef9c3" stroke="#a16207"/><text x="300" y="245" font-weight="bold" fill="#713f12">Security checks</text><text x="300" y="264" font-size="11" fill="#854d0e">SAST: Bandit + CodeQL</text><text x="300" y="281" font-size="11" fill="#854d0e">SCA: pip-audit + npm</text><text x="300" y="298" font-size="11" fill="#854d0e">Secrets: Gitleaks</text>
    <rect x="400" y="220" width="150" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="475" y="250" font-weight="bold" fill="#0c4a6e">Docker build</text><text x="475" y="270" fill="#075985">backend + frontend</text><text x="475" y="288" fill="#075985">tag = commit SHA</text>
    <rect x="565" y="220" width="150" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="640" y="250" font-weight="bold" fill="#7f1d1d">Trivy image scan</text><text x="640" y="270" fill="#991b1b">fail on fixable</text><text x="640" y="288" fill="#991b1b">HIGH / CRITICAL</text>
    <rect x="730" y="220" width="130" height="90" rx="8" fill="#fde68a" stroke="#b45309"/><text x="795" y="258" font-weight="bold" fill="#78350f">Security</text><text x="795" y="276" font-weight="bold" fill="#78350f">gate</text>
    <rect x="875" y="220" width="150" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="950" y="250" font-weight="bold" fill="#4c1d95">Push to GHCR</text><text x="950" y="270" fill="#5b21b6">stockwise-backend:SHA</text><text x="950" y="288" fill="#5b21b6">stockwise-frontend:SHA</text>
    <rect x="1040" y="220" width="150" height="90" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="1115" y="250" font-weight="bold" fill="#312e81">Deploy test</text><text x="1115" y="270" fill="#3730a3">kind + Helm</text><text x="1115" y="288" fill="#3730a3">smoke test</text>
    <rect x="1205" y="220" width="150" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce"/><text x="1280" y="250" font-weight="bold" fill="#581c87">GitOps bump</text><text x="1280" y="270" fill="#6b21a8">commit new SHA to</text><text x="1280" y="288" fill="#6b21a8">values-gitops.yaml</text>
  </g>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#a)">
    <line x1="185" y1="265" x2="213" y2="265"/><line x1="385" y1="265" x2="398" y2="265"/><line x1="550" y1="265" x2="563" y2="265"/>
    <line x1="715" y1="265" x2="728" y2="265"/><line x1="860" y1="265" x2="873" y2="265"/><line x1="1025" y1="265" x2="1038" y2="265"/><line x1="1190" y1="265" x2="1203" y2="265"/>
  </g>
  <line x1="270" y1="150" x2="130" y2="218" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1280,220 C1280,140 600,110 392,115" fill="none" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="840" y="128" font-size="12" fill="#6a1b9a">new image tag committed to Git</text>

  <!-- Argo CD -->
  <rect x="440" y="360" width="200" height="60" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="540" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">Argo CD</text>
  <text x="540" y="405" text-anchor="middle" font-size="12" fill="#6b21a8">pulls Helm chart from Git</text>
  <path d="M320,150 L200,176 L200,345 L438,388" fill="none" stroke="#6a1b9a" stroke-width="2" marker-end="url(#g)"/>
  <rect x="690" y="360" width="200" height="60" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="790" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">GHCR</text>
  <text x="790" y="405" text-anchor="middle" font-size="12" fill="#5b21b6">container registry</text>
  <line x1="950" y1="310" x2="860" y2="358" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cluster -->
  <rect x="30" y="450" width="1100" height="380" rx="14" fill="#f0f9ff" stroke="#0369a1" stroke-width="2.5"/>
  <text x="48" y="476" font-size="15" font-weight="bold" fill="#0369a1">Kubernetes cluster (AWS EKS via Terraform, or minikube locally)  ·  Helm release "stockwise"</text>
  <line x1="540" y1="420" x2="540" y2="448" stroke="#6a1b9a" stroke-width="2" marker-end="url(#g)"/>
  <text x="550" y="440" font-size="11" fill="#6a1b9a">sync</text>
  <line x1="790" y1="420" x2="790" y2="448" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="800" y="440" font-size="11" fill="#37474f">pull images</text>

  <rect x="60" y="495" width="140" height="300" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="130" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Users</text>
  <text x="130" y="545" text-anchor="middle" font-size="12" fill="#9a3412">browser</text>
  <rect x="230" y="495" width="170" height="300" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <text x="315" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#115e59">Ingress (nginx)</text>
  <text x="315" y="548" text-anchor="middle" font-size="12" fill="#134e4a">stockwise.local</text>
  <text x="315" y="600" text-anchor="middle" font-size="12" fill="#134e4a">/      → frontend</text>
  <text x="315" y="700" text-anchor="middle" font-size="12" fill="#134e4a">/api  → backend</text>
  <line x1="200" y1="645" x2="228" y2="645" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="440" y="500" width="250" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="565" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Frontend · 2 pods</text>
  <text x="565" y="547" text-anchor="middle" font-size="12" fill="#075985">React + nginx (non-root)</text>
  <text x="565" y="566" text-anchor="middle" font-size="12" fill="#075985">liveness/readiness /healthz</text>
  <text x="565" y="585" text-anchor="middle" font-size="12" fill="#075985">ClusterIP Service</text>
  <rect x="440" y="640" width="250" height="160" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="565" y="666" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Backend · 2-5 pods (HPA)</text>
  <text x="565" y="687" text-anchor="middle" font-size="12" fill="#166534">FastAPI, /metrics</text>
  <text x="565" y="706" text-anchor="middle" font-size="12" fill="#166534">startup/liveness /health, readiness /ready</text>
  <text x="565" y="725" text-anchor="middle" font-size="12" fill="#166534">ConfigMap + Secret (DB password)</text>
  <text x="565" y="744" text-anchor="middle" font-size="12" fill="#166534">migration Job (Alembic)</text>
  <text x="565" y="763" text-anchor="middle" font-size="12" fill="#166534">ClusterIP Service</text>
  <line x1="400" y1="597" x2="438" y2="560" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="697" x2="438" y2="710" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="740" y="700" width="170" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="825" y="724" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">PostgreSQL</text>
  <text x="825" y="744" text-anchor="middle" font-size="12" fill="#92400e">StatefulSet</text>
  <text x="825" y="762" text-anchor="middle" font-size="12" fill="#92400e">PersistentVolumeClaim</text>
  <text x="825" y="780" text-anchor="middle" font-size="12" fill="#92400e">1Gi storage</text>
  <line x1="690" y1="752" x2="738" y2="752" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="940" y="500" width="170" height="300" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="1025" y="528" text-anchor="middle" font-size="14" font-weight="bold" fill="#9f1239">Monitoring</text>
  <text x="1025" y="555" text-anchor="middle" font-size="12" fill="#9f1239">Prometheus</text>
  <text x="1025" y="574" text-anchor="middle" font-size="12" fill="#9f1239">(ServiceMonitor)</text>
  <text x="1025" y="606" text-anchor="middle" font-size="12" fill="#9f1239">Grafana dashboard</text>
  <text x="1025" y="638" text-anchor="middle" font-size="12" fill="#9f1239">Alert rules</text>
  <text x="1025" y="670" text-anchor="middle" font-size="12" fill="#9f1239">kube-state-metrics</text>
  <text x="1025" y="690" text-anchor="middle" font-size="12" fill="#9f1239">node-exporter</text>
  <path d="M938,665 L692,665" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="760" y="655" font-size="11" fill="#be123c">scrape /metrics</text>

  <!-- Terraform -->
  <rect x="1160" y="450" width="210" height="200" rx="12" fill="#f5f3ff" stroke="#5b21b6" stroke-width="2"/>
  <text x="1265" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Terraform (AWS)</text>
  <text x="1265" y="505" text-anchor="middle" font-size="12" fill="#5b21b6">VPC 10.30.0.0/16</text>
  <text x="1265" y="524" text-anchor="middle" font-size="12" fill="#5b21b6">2 public + 2 private subnets</text>
  <text x="1265" y="543" text-anchor="middle" font-size="12" fill="#5b21b6">NAT gateway</text>
  <text x="1265" y="562" text-anchor="middle" font-size="12" fill="#5b21b6">EKS cluster</text>
  <text x="1265" y="581" text-anchor="middle" font-size="12" fill="#5b21b6">managed node group (2-4)</text>
  <line x1="1158" y1="560" x2="1132" y2="560" stroke="#5b21b6" stroke-width="2" marker-end="url(#a)"/>
  <text x="1265" y="620" text-anchor="middle" font-size="11" fill="#6d28d9">provisions the cluster</text>
</svg>
